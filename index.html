<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Media</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Tahoma, Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      background: linear-gradient(135deg, #24242b, #111116);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .cover span {
      font-size: 70px;
      opacity: .8;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .message {
      background: #17171d;
      border-radius: 20px;
      padding: 20px;
      line-height: 2;
      text-align: center;
      margin-bottom: 20px;
    }

    .media-box {
      background: #17171d;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
    }

    .media-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    audio,
    video {
      width: 100%;
      display: block;
    }

    video {
      border-radius: 14px;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- تصویر اصلی -->
    <div class="cover">
      <span>🎵</span>
    </div>

    <!-- عنوان -->
    <h1>یک لحظه برای تو</h1>

    <div class="subtitle">
      QR Media
    </div>

    <!-- متن -->
    <div class="message">
      اینجا می‌تونیم هر متنی که بخوای قرار بدیم.
      <br>
      حتی می‌تونیم هر بار این متن رو تغییر بدیم.
    </div>

    <!-- آهنگ -->
    <div class="media-box">

      <div class="media-title">
        🎵 آهنگ
      </div>

      <audio controls>
        <!-- فایل آهنگ بعداً اینجا قرار می‌گیرد -->
      </audio>

    </div>

    <!-- ویدئو -->
    <div class="media-box">

      <div class="media-title">
        🎬 ویدئو
      </div>

      <video controls>
        <!-- فایل ویدئو بعداً اینجا قرار می‌گیرد -->
      </video>

    </div>

    <div class="footer">
      QR Media
    </div>

  </main>

</body>
</html>
