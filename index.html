<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Media</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 30px 20px;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      line-height: 1.8;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>QR Media</h1>

    <p>
      این صفحه مخصوص QR Code من است.
    </p>

    <!-- آهنگ و فیلم بعداً اینجا قرار می‌گیرند -->

  </div>

</body>
</html>
